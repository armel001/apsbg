<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="site-footer__col">
      <p class="site-footer__title">{{ site.title }}</p>
      <p class="site-footer__tagline">{{ site.tagline }}</p>
    </div>
    <div class="site-footer__col">
      <p><a href="mailto:{{ site.contact_email }}">{{ site.contact_email }}</a></p>
      <p class="site-footer__meta">Conakry, République de Guinée</p>
    </div>
  </div>
  <p class="site-footer__copy">© {{ 'now' | date: "%Y" }} {{ site.title }}. Tous droits réservés.</p>
</footer>
